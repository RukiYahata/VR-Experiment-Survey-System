<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>アンケート</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1d2733; --line:#cfd6de; --accent:#1f5f8b; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --fg:#e6ebf0; --line:#3a4551; --accent:#6db3e0; --bad:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.7 "BIZ UDPGothic","Hiragino Sans",sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
  input, select { width:100%; padding:10px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:4px; }
  label.f { display:block; margin:14px 0 2px; font-size:.9rem; }
  button { font:inherit; padding:10px 22px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; margin-top:20px; }
  button:disabled { opacity:.5; } button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .q { padding:14px 0; border-bottom:1px solid var(--line); } .q.miss { border-left:4px solid var(--bad); padding-left:10px; }
  .scale { display:flex; justify-content:space-between; gap:4px; margin-top:6px; }
  .scale label { flex:1; text-align:center; cursor:pointer; padding:8px 0; border:1px solid var(--line); border-radius:4px; }
  .scale input { display:none; } .scale input:checked + span { font-weight:bold; }
  .scale label:has(input:checked) { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ends { display:flex; justify-content:space-between; font-size:.8rem; opacity:.7; }
  .err { color:var(--bad); } .hint { font-size:.85rem; opacity:.7; }
</style>
</head>
<body>
<main id="root"><p>読み込み中…</p></main>
<script src="../common.js"></script>
<script>
const root = document.getElementById('root');
let cfg, conds, session, secOrder, secIdx;
const answers = {}, orders = {};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

(async function init() {
  try { cfg = await fetchConfig(); } catch (e) { root.innerHTML = '<p class="err">設定を読み込めませんでした。通信状況を確認して再読み込みしてください。</p>'; return; }
  conds = buildConditions(cfg.factors);
  showStart();
})();

function showStart() {
  root.innerHTML = `<h1>アンケート</h1>
    <label class="f" for="uid">ユーザーID</label><input id="uid" autocomplete="off">
    <label class="f" for="trial">何回目</label><input id="trial" type="number" min="1" value="1">
    <label class="f" for="cond">条件</label>
    <select id="cond"><option value="">選択してください</option>${conds.map((c, i) => `<option value="${i}">${esc(c.label)}</option>`).join('')}</select>
    <p id="e" class="err"></p><button id="go">開始</button>`;
  document.getElementById('go').onclick = () => {
    const uid = document.getElementById('uid').value.trim(), trial = document.getElementById('trial').value, ci = document.getElementById('cond').value;
    if (!uid || !trial || ci === '') { document.getElementById('e').textContent = 'すべて入力してください'; return; }
    session = { userId: uid, trial: +trial, cond: conds[+ci] };
    secOrder = cfg.shuffleSections ? shuffle(cfg.sections) : cfg.sections.slice();
    // 分野ごとに項目をシャッフル(開始時に確定 → 戻っても順序は変わらない)
    secOrder.forEach(s => orders[s.id] = shuffle(s.items));
    secIdx = 0; showSection();
  };
}

function showSection() {
  const s = secOrder[secIdx], { min, max, minLabel, maxLabel } = cfg.scale;
  const nums = Array.from({ length: max - min + 1 }, (_, i) => min + i);
  root.innerHTML = `<h1>${esc(s.title)} <small class="hint">(${secIdx + 1}/${secOrder.length})</small></h1>` +
    orders[s.id].map((it, n) => `<div class="q" data-id="${esc(it.id)}"><div>${n + 1}. ${esc(it.text)}</div>
      <div class="scale">${nums.map(v => `<label><input type="radio" name="${esc(it.id)}" value="${v}" ${answers[it.id] == v ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div>
      <div class="ends"><span>${esc(minLabel)}</span><span>${esc(maxLabel)}</span></div></div>`).join('') +
    `<p id="e" class="err"></p><button id="next">${secIdx + 1 < secOrder.length ? '次へ' : '送信'}</button>`;
  document.getElementById('next').onclick = async function () {
    let missing = null;
    orders[s.id].forEach(it => {
      const c = root.querySelector(`input[name="${CSS.escape(it.id)}"]:checked`);
      const box = root.querySelector(`.q[data-id="${CSS.escape(it.id)}"]`);
      if (c) { answers[it.id] = +c.value; box.classList.remove('miss'); } else { box.classList.add('miss'); missing = missing || box; }
    });
    if (missing) { document.getElementById('e').textContent = '未回答の項目があります'; missing.scrollIntoView({ block: 'center' }); return; }
    if (++secIdx < secOrder.length) { showSection(); window.scrollTo(0, 0); return; }
    this.disabled = true; this.textContent = '送信中…';
    try {
      const r = await postGas({
        action: 'submit', userId: session.userId, trial: session.trial,
        conditionId: session.cond.id, conditionLabel: session.cond.label,
        answers, sectionOrder: secOrder.map(x => x.id).join(','),
        orders: Object.fromEntries(Object.entries(orders).map(([k, v]) => [k, v.map(i => i.id).join(',')]))
      });
      if (!r.ok) throw new Error(r.error);
      root.innerHTML = '<h1>ご協力ありがとうございました</h1><p>回答を送信しました。</p>';
    } catch (e) {
      secIdx--; this.disabled = false; this.textContent = '再送信';
      document.getElementById('e').textContent = '送信に失敗しました。もう一度押してください: ' + e.message;
    }
  };
}
</script>
</body>
</html>
